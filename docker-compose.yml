services:
  mamajula-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://ytvrtrozkkjsuofevyab.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    image: mamajula:latest
    container_name: mamajula-app
    restart: unless-stopped

    networks:
      - network_public

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    labels:
      # ---- Traefik habilitado para esse serviço ----
      - "traefik.enable=true"
      - "traefik.docker.network=network_public"

      # ===== Router HTTPS =====
      - "traefik.http.routers.mamajula-https.entrypoints=websecure"
      - "traefik.http.routers.mamajula-https.rule=Host(`teste.mamajula.com.br`) || Host(`www.teste.mamajula.com.br`)"
      - "traefik.http.routers.mamajula-https.tls=true"
      - "traefik.http.routers.mamajula-https.tls.certresolver=leresolver"
      - "traefik.http.routers.mamajula-https.tls.domains[0].main=teste.mamajula.com.br"
      - "traefik.http.routers.mamajula-https.tls.domains[0].sans=www.teste.mamajula.com.br"
      - "traefik.http.routers.mamajula-https.service=mamajula-service"
      - "traefik.http.routers.mamajula-https.priority=1000"

      # ===== Router HTTP -> redirect 301 HTTPS =====
      - "traefik.http.routers.mamajula-http.entrypoints=web"
      - "traefik.http.routers.mamajula-http.rule=Host(`teste.mamajula.com.br`) || Host(`www.teste.mamajula.com.br`)"
      - "traefik.http.routers.mamajula-http.middlewares=mamajula-redirect"
      - "traefik.http.routers.mamajula-http.priority=1000"
      - "traefik.http.middlewares.mamajula-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.mamajula-redirect.redirectscheme.permanent=true"

      # ===== Serviço: porta 80 do nginx =====
      - "traefik.http.services.mamajula-service.loadbalancer.server.port=80"
      - "traefik.http.services.mamajula-service.loadbalancer.server.scheme=http"
      - "traefik.http.services.mamajula-service.loadbalancer.passHostHeader=true"
      - "traefik.http.services.mamajula-service.loadbalancer.server.transport.respondingTimeouts.readTimeout=60"

networks:
  # 🔑 Usa a rede do seu traefik antigo (já existente, criada manualmente/fora do compose).
  #    Declaramos SOMENTE como external=true + name, para o Compose não tentar recriar
  #    (evita o erro "has incorrect label com.docker.compose.network set to ''").
  network_public:
    external: true
    name: network_public
