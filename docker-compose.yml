services:
  mamajula-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://ytvrtrozkkjsuofevyab.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    image: mamajula:latest
    container_name: mamajula-app
    restart: unless-stopped

    networks:
      - portainer_default

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    labels:
      # ====== Padrão IDÊNTICO dos seus outros projetos (evolution_v2) ======
      # Router 1: teste.mamajula.com.br
      - "traefik.enable=true"
      - "traefik.http.routers.mamajula.rule=Host(`teste.mamajula.com.br`)"
      - "traefik.http.routers.mamajula.entrypoints=websecure"
      - "traefik.http.routers.mamajula.tls=true"
      - "traefik.http.routers.mamajula.tls.certresolver=leresolver"
      - "traefik.docker.network=portainer_default"
      - "traefik.http.services.mamajula.loadbalancer.server.port=80"
      - "traefik.http.services.mamajula.loadbalancer.passHostHeader=true"

      # Router 2: www.teste.mamajula.com.br (router separado, mesmo service — evita bug do || em múltiplos Hosts)
      - "traefik.http.routers.mamajula-www.rule=Host(`www.teste.mamajula.com.br`)"
      - "traefik.http.routers.mamajula-www.entrypoints=websecure"
      - "traefik.http.routers.mamajula-www.tls=true"
      - "traefik.http.routers.mamajula-www.tls.certresolver=leresolver"
      - "traefik.http.routers.mamajula-www.service=mamajula"

networks:
  # 🔑 Usa a REDE REAL onde o seu traefik antigo está (a mesma dos seus outros projetos!)
  #    external=true só conecta, não tenta recriar.
  portainer_default:
    external: true
    name: portainer_default
