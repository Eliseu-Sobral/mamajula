services:
  mamajula-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://ytvrtrozkkjsuofevyab.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    image: mamajula:latest
    container_name: mamajula-app
    restart: unless-stopped

    networks:
      - portainer_default

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    labels:
      # =====================================================
      # Padrão IDÊNTICO do seu projeto evolution_v2
      # - 1 único domínio (simplifica; adicionamos www DEPOIS que funcionar).
      # - FORMATO HOST OBRIGATÓRIO (igual a TODOS os seus apps que funcionam!):
      #   Host(`dominio.com.br`)    ← CRASES DENTRO.
      #   Sem crases = Traefik interpreta dominio como VARIAVEL e dá "is not defined" / disabled.
      # - Label redundante traefik.port (legado).
      # =====================================================
      - 'traefik.enable=true'
      - 'traefik.docker.network=portainer_default'
      - 'traefik.port=80'

      # ---------- Router: teste.mamajula.com.br ----------
      - 'traefik.http.routers.mamajula.entrypoints=websecure'
      - 'traefik.http.routers.mamajula.rule=Host(`teste.mamajula.com.br`)'
      - 'traefik.http.routers.mamajula.service=mamajula'
      - 'traefik.http.routers.mamajula.tls=true'
      - 'traefik.http.routers.mamajula.tls.certresolver=leresolver'

      # ---------- Service: mamajula ----------
      - 'traefik.http.services.mamajula.loadbalancer.server.port=80'
      - 'traefik.http.services.mamajula.loadbalancer.server.scheme=http'
      - 'traefik.http.services.mamajula.loadbalancer.passHostHeader=true'

networks:
  # 🔑 Usa a REDE REAL onde o seu traefik antigo está (a mesma dos seus outros projetos!)
  #    external=true só conecta, não tenta recriar.
  portainer_default:
    external: true
    name: portainer_default
