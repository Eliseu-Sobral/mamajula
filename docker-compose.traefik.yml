services:
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      # Dashboard TEMPORARIO (acesso apenas local ao servidor)
      # curl -s http://127.0.0.1:8080/api/http/routers
      # ou port-forward SSH: ssh -L 8080:127.0.0.1:8080 usuario@servidor
      - "127.0.0.1:8080:8080"

    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-acme:/letsencrypt"

    networks:
      - mamajula

    command:
      # ===== Globais =====
      - "--log.level=DEBUG"
      - "--global.sendAnonymousUsage=false"
      - "--global.checkNewVersion=false"

      # ===== Dashboard / API =====
      - "--api=true"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--api.debug=true"

      # ===== Entrypoints =====
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.options=default"

      # ===== Provider: Docker =====
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=mamajula"
      - "--providers.docker.swarmmode=false"

      # ===== Certificate Resolver: Let's Encrypt — NOME: leresolver =====
      - "--certificatesresolvers.leresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.leresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.leresolver.acme.email=admin@mamajula.com.br"
      - "--certificatesresolvers.leresolver.acme.storage=/letsencrypt/acme.json"

    labels:
      # ---- Catch-all de DIAGNÓSTICO: quem bater aqui vê um whoami com o host que chegou ----
      - "traefik.enable=true"
      - "traefik.docker.network=mamajula"

      - "traefik.http.routers.traefik-debug-http.entrypoints=web"
      - "traefik.http.routers.traefik-debug-http.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.traefik-debug-http.priority=-10"
      - "traefik.http.routers.traefik-debug-http.service=traefik-debug-service"

      - "traefik.http.routers.traefik-debug-https.entrypoints=websecure"
      - "traefik.http.routers.traefik-debug-https.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.traefik-debug-https.priority=-10"
      - "traefik.http.routers.traefik-debug-https.tls=true"
      - "traefik.http.routers.traefik-debug-https.tls.certresolver=leresolver"
      - "traefik.http.routers.traefik-debug-https.tls.domains[0].main=*.mamajula.com.br"
      - "traefik.http.routers.traefik-debug-https.service=traefik-debug-service"

      - "traefik.http.services.traefik-debug-service.loadbalancer.server.port=80"
      - "traefik.http.services.traefik-debug-service.loadbalancer.server.scheme=http"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-proxy http://127.0.0.1:8080/api/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Serviço whoami para o catch-all de diagnóstico
  whoami:
    image: traefik/whoami:v1.10
    container_name: traefik-whoami
    restart: unless-stopped
    networks:
      - mamajula
    expose:
      - "80"
    labels:
      - "traefik.enable=false"

volumes:
  traefik-acme:
    name: traefik-acme

# 🔑 REDE mamajula CRIADA AQUI, DENTRO DO STACK (não mais external!)
#    Driver bridge garantido, attachable, DHCP do Docker alocando IPv4/Gateway/MAC.
#    DEPOIS que o stack do traefik subir, o stack da aplicação (docker-compose.yml)
#    vai usar essa mesma rede como "external: true, name: mamajula".
networks:
  mamajula:
    name: mamajula
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: "br-mamajula"
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
    attachable: true
    internal: false
    # Descomente abaixo se precisar de range fixo (raro), senão deixe o Docker decidir:
    # ipam:
    #   config:
    #     - subnet: "172.28.0.0/16"
    #       gateway: "172.28.0.1"
