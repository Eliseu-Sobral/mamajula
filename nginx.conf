server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão GZIP (reduz transferência de JS/CSS/HTML)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/xml
        image/svg+xml
        font/woff2
        font/woff
        font/ttf;

    # Cabeçalhos de segurança (não impacta Traefik, só complementa)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Cache AGRESSIVO para assets com hash no nome (Vite gera [name].[hash].js/.css)
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service Worker e manifest PWA — SEM cache (precisa ser sempre atualizado)
    location ~* ^/(sw\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # SPA fallback: qualquer rota que não seja arquivo cai no index.html (React Router)
    location / {
        add_header Cache-Control "no-cache, must-revalidate, max-age=0";
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck para Docker/Traefik
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
